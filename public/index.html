<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor Inteligente</title>
    <style>
        /* Variáveis de Tema (Claro por padrão) */
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f8f9fa;
            --surface: #ffffff;
            --text: #333333;
            --text-muted: #7f8c8d;
            --border: #e2e8f0;
            --danger: #e74c3c;
            --success: #27ae60;
        }

        /* Variáveis de Tema (Noturno) */
        body.dark-mode {
            --primary: #ecf0f1;
            --accent: #2980b9;
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #e0e0e0;
            --text-muted: #95a5a6;
            --border: #333333;
        }

        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); transition: background-color 0.3s, color 0.3s; }
        
        /* Navbar Minimalista */
        nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; transition: background-color 0.3s; }
        .nav-brand { font-weight: 600; font-size: 1.2rem; color: var(--primary); letter-spacing: 0.5px; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        nav button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: 500; font-size: 0.95rem; padding: 5px 10px; transition: color 0.2s; }
        nav button.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        
        .btn-outline { border: 1px solid var(--border) !important; border-radius: 4px; }
        .btn-outline:hover { background: var(--border); }
        .btn-danger { color: var(--danger) !important; }

        /* Leitor */
        .container-leitor { flex-grow: 1; display: flex; flex-direction: column; padding: 20px 10px; max-width: 1000px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .upload-bar { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .upload-bar input { color: var(--text); }
        .btn-primary { background: var(--primary); color: var(--surface); border: none; padding: 8px 16px; border-radius: 4px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
        .btn-primary:hover { opacity: 0.9; }
        
        #viewer { flex-grow: 1; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); height: 70vh; transition: background-color 0.3s; overflow: auto; }
        #pdfViewer { min-height: 100%; padding: 20px; box-sizing: border-box; }
        .pdf-page { position: relative; width: fit-content; margin: 0 auto; background: #ffffff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }
        .pdf-page canvas { display: block; }
        .pdf-text-layer { position: absolute; inset: 0; overflow: hidden; opacity: 0.2; line-height: 1; }
        .pdf-text-layer span { position: absolute; white-space: pre; transform-origin: 0 0; color: transparent; cursor: text; }
        .pdf-text-layer ::selection { background: rgba(52, 152, 219, 0.35); }
        .pdf-controls { display: none; justify-content: center; align-items: center; gap: 12px; margin-top: 10px; color: var(--text-muted); }

        /* Vocabulário */
        .livro-grupo { margin-bottom: 40px; }
        .livro-titulo-grupo { border-bottom: 1px solid var(--border); padding-bottom: 8px; color: var(--primary); font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; }
        .vocab-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .vocab-grid { grid-template-columns: 1fr 1fr; } }
        
        .vocab-card { background: var(--surface); padding: 25px; border-radius: 8px; border: 1px solid var(--border); position: relative; display: flex; flex-direction: column; transition: background-color 0.3s; }
        .vocab-card strong { font-size: 1.1rem; color: var(--accent); margin-bottom: 8px; }
        .vocab-card i { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px; display: block; font-style: italic; }
        .vocab-card p { margin: 0; font-size: 0.95rem; line-height: 1.6; color: var(--text); flex-grow: 1; }
        
        .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
        .btn-text { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.9rem; font-weight: 500; padding: 0; }
        .btn-text.danger { color: var(--text-muted); }
        .btn-text.danger:hover { color: var(--danger); }

        /* Modal Minimalista */
        #modalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; backdrop-filter: blur(2px); }
        #modalContent { width: 90%; max-width: 450px; background: var(--surface); padding: 30px; border-radius: 8px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px solid var(--border); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; font-size: 1.1rem; color: var(--primary); }
        .close-btn { cursor: pointer; color: var(--text-muted); font-size: 1.5rem; line-height: 1; }
        #termo-box { font-size: 1.1rem; font-weight: 600; color: var(--accent); margin-bottom: 10px; }
        #traducao-box { font-size: 1.05rem; font-weight: 600; color: var(--primary); margin-bottom: 12px; }
        #explicacao-box { font-size: 0.95rem; line-height: 1.6; color: var(--text); margin-bottom: 25px; }

        /* Autenticação (Mantida simples) */
        .auth-container { background: var(--surface); padding: 40px; border-radius: 8px; border: 1px solid var(--border); width: 100%; max-width: 380px; }
        .auth-input { width: 100%; padding: 12px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--text); box-sizing: border-box; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div id="auth-screen" style="display: flex; height: 100vh; justify-content: center; align-items: center; padding: 20px;">
        <div class="auth-container">
            <h2 style="margin-top: 0; text-align: center; color: var(--primary);">Leitor Inteligente</h2>
            <div style="display: flex; margin-bottom: 25px; border-bottom: 1px solid var(--border);">
                <button id="tabLogin" style="flex: 1; padding: 10px; cursor: pointer; font-weight: 500; border: none; background: none; border-bottom: 2px solid var(--accent); color: var(--accent);">Entrar</button>
                <button id="tabCadastro" style="flex: 1; padding: 10px; cursor: pointer; font-weight: 500; border: none; background: none; color: var(--text-muted);">Cadastrar</button>
            </div>
            <div>
                <input type="text" id="authNome" class="auth-input" placeholder="Nome" style="display: none;">
                <input type="email" id="authEmail" class="auth-input" placeholder="E-mail">
                <input type="password" id="authSenha" class="auth-input" placeholder="Senha">
                <p id="authMessage" style="font-size: 13px; margin: 0 0 15px 0; font-weight: 500; display: none;"></p>
                <button id="btnAuthAction" class="btn-primary" style="width: 100%; padding: 14px;">Entrar</button>
            </div>
        </div>
    </div>

    <div id="app-screen" style="display: none; flex-direction: column; height: 100vh;">
        <nav>
            <div class="nav-brand">Leitor Inteligente</div>
            <div class="nav-links">
                <button id="navLeitor" class="active">Leitor</button>
                <button id="navVocab">Vocabulário</button>
                <button id="btnThemeToggle" class="btn-outline">Modo Escuro</button>
                <button id="btnLogout" class="btn-danger">Sair</button>
            </div>
        </nav>
        
        <div id="screen-reader" class="sub-screen container-leitor">
            <div class="upload-bar">
                <input type="file" id="bookInput" accept=".epub,.pdf,application/epub+zip,application/pdf">
                <button id="uploadBtn" class="btn-primary">Abrir Arquivo</button>
            </div>
            <div id="viewer"></div>
            <div id="pdf-controls" class="pdf-controls">
                <button id="pdf-prev" class="btn-outline" type="button">Página anterior</button>
                <span id="pdf-page-number">Página 1</span>
                <button id="pdf-next" class="btn-outline" type="button">Próxima página</button>
            </div>
            <div id="controls" style="display: none; text-align: center; margin-top: 10px; color: var(--text-muted); font-size: 0.85rem;">
                Clique nas laterais da tela para mudar de página.
            </div>
        </div>

        <div id="screen-vocab" class="sub-screen" style="display: none; flex-grow: 1; padding: 30px 20px; overflow-y: auto;">
            <div style="max-width: 900px; margin: 0 auto;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <h2 style="margin: 0; color: var(--primary);">Seu Vocabulário</h2>
                    <button id="btnIniciarJogo" class="btn-primary" style="background: var(--accent);">Iniciar Revisão</button>
                </div>
                <div id="lista-flashcards"></div>
            </div>
        </div>

        <div id="screen-game" class="sub-screen" style="display: none; flex-grow: 1; background: var(--bg); padding: 20px; position: relative;">
            <div style="max-width: 600px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; justify-content: center;">
                <div id="game-loading" style="text-align: center; display: none;"><h3 color="var(--text-muted)">Gerando perguntas...</h3></div>
                <div id="game-content" style="display: none;">
                    <div style="background: var(--surface); border: 1px solid var(--border); padding: 30px; border-radius: 8px; margin-bottom: 20px;">
                        <h2 id="game-pergunta" style="margin: 0; font-size: 1.2rem; text-align: center;"></h2>
                    </div>
                    <div id="game-opcoes" style="display: grid; grid-template-columns: 1fr; gap: 10px;">
                        <button class="game-opt btn-outline" style="padding: 15px; background: var(--surface); color: var(--text); cursor: pointer;">Opt 1</button>
                        <button class="game-opt btn-outline" style="padding: 15px; background: var(--surface); color: var(--text); cursor: pointer;">Opt 2</button>
                        <button class="game-opt btn-outline" style="padding: 15px; background: var(--surface); color: var(--text); cursor: pointer;">Opt 3</button>
                        <button class="game-opt btn-outline" style="padding: 15px; background: var(--surface); color: var(--text); cursor: pointer;">Opt 4</button>
                    </div>
                </div>
                <div id="game-feedback" style="display: none; text-align: center; padding: 20px;">
                    <h1 id="feedback-titulo" style="font-size: 2rem;"></h1>
                    <p id="feedback-texto" style="font-size: 1rem; margin-bottom: 30px; color: var(--text);"></p>
                    <button id="btnProximaPergunta" class="btn-primary" style="width: 100%;">Avançar</button>
                </div>
            </div>
            <button id="btnSairJogo" class="btn-outline" style="position: absolute; top: 20px; right: 20px; padding: 8px 15px;">Encerrar</button>
        </div>

        <div id="modalOverlay">
            <div id="modalContent">
                <div class="modal-header">
                    <h3>Análise Contextual</h3>
                    <span id="closeModal" class="close-btn">&times;</span>
                </div>
                <div id="termo-box"></div>
                <div id="traducao-box"></div>
                <div id="explicacao-box"></div>
                <button id="btnSalvarCard" class="btn-primary" style="width: 100%; display: none;">Salvar Palavra</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="script.js"></script>
</body>
<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
</script>
</html>
